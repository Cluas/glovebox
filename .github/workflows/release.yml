name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no dependencies to cache
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: test
        run: go test ./...
      - name: build module with overlay
        env:
          KEYSTORE_B64: ${{ secrets.OVERLAY_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.OVERLAY_KEYSTORE_PASS }}
        run: |
          # a stable signing key keeps overlay upgrades clean; without the secret a throwaway key is generated
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > overlay/overlay.keystore; fi
          export KEYSTORE_PASS=${KEYSTORE_PASS:-android}
          VERSION=${GITHUB_REF_NAME#v} ./build.sh
      - name: sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # devices poll releases/latest/download/update.json; a fork without the secret ships the zip only
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "no UPDATE_SIGNING_KEY, skipping update.json"; exit 0; fi
          key=$RUNNER_TEMP/update.key
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          zip=$(ls dist/glovebox-*.zip)
          go run . update sign -key "$key" -zip "$zip" -out dist/update.json \
            -url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$zip")"
          rm -f "$key"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/glovebox-*.zip $(ls dist/update.json 2>/dev/null) --generate-notes
